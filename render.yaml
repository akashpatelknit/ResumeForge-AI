services:
  - type: worker
    name: resumeforge-outreach-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run worker
    autoDeployTrigger: commit
    envVars:
      # Same secrets the Vercel app uses — this worker does the same
      # Gmail/AI/DB work, just triggered by a queued job instead of a
      # request. Set actual values in the Render dashboard (Environment
      # tab) rather than here — this file only declares which vars exist.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NODE_VERSION
        value: 24.19.0
